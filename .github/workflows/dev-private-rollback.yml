name: Dev Private Rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '要回退到的镜像标签 (例如: dev, dev-7b3f1a2)'
        required: false
        type: string
      list_only:
        description: '仅列出可用镜像，不执行回退'
        required: false
        type: boolean
        default: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH Remote Rollback
        uses: appleboy/ssh-action@master
        env:
          PRIVATE_REGISTRY_USERNAME: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          PRIVATE_REGISTRY_PASSWORD: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          LIST_ONLY: ${{ inputs.list_only }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: PRIVATE_REGISTRY_USERNAME,PRIVATE_REGISTRY_PASSWORD,DEPLOY_DIR,IMAGE_TAG,LIST_ONLY
          script: |
            set -e

            REGISTRY="docker.topren.top"
            IMAGE_NAME="sub2api"
            FULL_IMAGE="${REGISTRY}/${IMAGE_NAME}"

            echo "=========================================="
            echo "🔍 当前本地可用的镜像版本:"
            echo "=========================================="
            docker images "${FULL_IMAGE}" --format "table {{.Tag}}\t{{.ID}}\t{{.CreatedAt}}\t{{.Size}}" | head -20
            echo ""

            # 获取当前运行的镜像
            CURRENT_IMAGE=$(docker inspect --format='{{.Config.Image}}' $(docker-compose -f "${DEPLOY_DIR}/docker-compose.yml" ps -q 2>/dev/null | head -1) 2>/dev/null || echo "无法获取")
            echo "📌 当前运行的镜像: ${CURRENT_IMAGE}"
            echo ""

            # 如果只是列出镜像，到此结束
            if [ "$LIST_ONLY" = "true" ]; then
              echo "=========================================="
              echo "✅ 仅列出模式，未执行回退操作"
              echo "=========================================="
              exit 0
            fi

            # 检查是否提供了镜像标签
            if [ -z "$IMAGE_TAG" ]; then
              echo "=========================================="
              echo "❌ 错误: 未指定要回退的镜像标签"
              echo "请在 workflow 输入中指定 image_tag 参数"
              echo "=========================================="
              exit 1
            fi

            TARGET_IMAGE="${FULL_IMAGE}:${IMAGE_TAG}"

            # 检查目标镜像是否存在于本地
            if ! docker images --format "{{.Repository}}:{{.Tag}}" | grep -q "^${TARGET_IMAGE}$"; then
              echo "=========================================="
              echo "⚠️ 本地不存在镜像: ${TARGET_IMAGE}"
              echo "尝试从远程仓库拉取..."
              echo "=========================================="

              # 登录私有仓库
              echo "$PRIVATE_REGISTRY_PASSWORD" | docker login ${REGISTRY} -u "$PRIVATE_REGISTRY_USERNAME" --password-stdin

              if ! docker pull "${TARGET_IMAGE}"; then
                echo "❌ 拉取失败: ${TARGET_IMAGE}"
                echo "请检查镜像标签是否正确"
                exit 1
              fi
            fi

            echo "=========================================="
            echo "🔄 开始回退到: ${TARGET_IMAGE}"
            echo "=========================================="

            # 进入部署目录
            cd "$DEPLOY_DIR"

            # 更新 .env 中的镜像名
            touch .env
            if grep -q "^DOCKER_IMAGE_NAME=" .env 2>/dev/null; then
              sed -i "s|^DOCKER_IMAGE_NAME=.*|DOCKER_IMAGE_NAME=${TARGET_IMAGE}|" .env
            else
              echo "DOCKER_IMAGE_NAME=${TARGET_IMAGE}" >> .env
            fi

            # 重启服务
            echo "📦 停止当前容器..."
            docker-compose down

            echo "🚀 启动回退版本..."
            docker-compose up -d

            # 等待服务启动
            sleep 5

            echo ""
            echo "=========================================="
            echo "✅ 回退完成!"
            echo "=========================================="
            echo "🎯 目标镜像: ${TARGET_IMAGE}"
            echo ""
            echo "📊 当前服务状态:"
            docker-compose ps
            echo ""

            # 健康检查
            echo "🏥 容器健康状态:"
            docker-compose ps --format "table {{.Name}}\t{{.Status}}"

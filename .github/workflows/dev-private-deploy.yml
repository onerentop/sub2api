name: Dev Private Deploy

on:
  push:
    branches-ignore:
      - 'gh-pages'  # 忽略非代码分支

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Log in to Private Registry
        env:
          REGISTRY_USER: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          REGISTRY_PWD: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
        run: |
          echo "$REGISTRY_PWD" | docker login docker.topren.top -u "$REGISTRY_USER" --password-stdin

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.topren.top/sub2api
          # 生成两种 tag:
          # 1. 分支名 (例如: dev, fix-bug) - 总是指向该分支最新代码
          # 2. commit hash (例如: sha-7b3f1a2) - 用于回溯历史版本
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=dev-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 处理分支名，将 / 替换为 - 以适配 Docker Tag 规范
      - name: Sanitize Branch Name
        id: branch_name
        run: |
          # 获取原始分支名
          RAW_BRANCH="${{ github.ref_name }}"
          # 将 / 替换为 -
          SANITIZED_BRANCH="${RAW_BRANCH//\//-}"
          echo "Original: $RAW_BRANCH"
          echo "Sanitized: $SANITIZED_BRANCH"
          echo "tag=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT

      # 远程执行部署命令
      - name: SSH Remote Deploy
        uses: appleboy/ssh-action@master
        env:
          PRIVATE_REGISTRY_USERNAME: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          PRIVATE_REGISTRY_PASSWORD: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          IMAGE_TAG: ${{ steps.branch_name.outputs.tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: PRIVATE_REGISTRY_USERNAME,PRIVATE_REGISTRY_PASSWORD,DEPLOY_DIR,IMAGE_TAG
          script: |
            # 设置变量
            DOCKER_IMAGE_NAME="docker.topren.top/sub2api:${IMAGE_TAG}"
            echo "Deploying image: $DOCKER_IMAGE_NAME"

            # 调试：验证凭证（显示长度，不显示实际值）
            echo "=== Credential Check ==="
            echo "Username length: ${#PRIVATE_REGISTRY_USERNAME}"
            echo "Password length: ${#PRIVATE_REGISTRY_PASSWORD}"
            echo "========================"

            # 使用 curl 测试认证（这个之前是成功的）
            echo "=== Test API with curl ==="
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -u "$PRIVATE_REGISTRY_USERNAME:$PRIVATE_REGISTRY_PASSWORD" \
              https://docker.topren.top/v2/sub2api/tags/list)
            echo "HTTP Code: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "ERROR: API authentication failed!"
              echo "Testing with hardcoded credentials..."
              curl -s -u "admin:Password123" https://docker.topren.top/v2/sub2api/tags/list
            fi
            echo "========================"

            # 使用 skopeo 复制镜像（使用 --debug 获取更多信息）
            echo "Using skopeo to copy image..."
            if command -v skopeo &> /dev/null; then
              skopeo --debug copy --src-creds "$PRIVATE_REGISTRY_USERNAME:$PRIVATE_REGISTRY_PASSWORD" \
                docker://$DOCKER_IMAGE_NAME \
                docker-daemon:$DOCKER_IMAGE_NAME 2>&1 | head -100
            else
              apt-get update && apt-get install -y skopeo
              skopeo --debug copy --src-creds "$PRIVATE_REGISTRY_USERNAME:$PRIVATE_REGISTRY_PASSWORD" \
                docker://$DOCKER_IMAGE_NAME \
                docker-daemon:$DOCKER_IMAGE_NAME 2>&1 | head -100
            fi

            # 进入部署目录
            cd "$DEPLOY_DIR"

            # 更新 .env 中的镜像名
            touch .env
            if grep -q "^DOCKER_IMAGE_NAME=" .env 2>/dev/null; then
              sed -i "s|^DOCKER_IMAGE_NAME=.*|DOCKER_IMAGE_NAME=${DOCKER_IMAGE_NAME}|" .env
            else
              echo "DOCKER_IMAGE_NAME=${DOCKER_IMAGE_NAME}" >> .env
            fi

            # 使用环境变量重启
            DOCKER_IMAGE_NAME="$DOCKER_IMAGE_NAME" docker-compose up -d

            # 清理旧镜像
            docker image prune -f

            # 显示部署状态
            echo "Deploy completed!"
            docker-compose ps
